<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quên mật khẩu - SafeCheck</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="css/account.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav container">
      <a class="brand" href="../index.html"><span class="brand-mark">✓</span>SafeCheck</a>
      <div class="nav-links">
        <a href="../index.html">Trang chủ</a>
        <a href="login.html">Đăng nhập</a>
        <button class="button outline" type="button" data-dark-toggle>◐</button>
      </div>
    </nav>
  </header>

  <main class="auth-wrap">
    <section class="card auth-card">
      <div class="auth-icon">🔑</div>
      <div class="eyebrow">Khôi phục tài khoản</div>
      <h1>Quên mật khẩu?</h1>
      <p class="muted">Nhập email đã đăng ký để nhận mã OTP và đặt lại mật khẩu mới.</p>

      <form id="forgotForm">
        <div class="field">
          <label for="forgotEmail">Email đã đăng ký *</label>
          <div class="input-action-row">
            <input id="forgotEmail" type="email" required placeholder="email@example.com">
            <button id="btnSendForgotOtp" class="button outline" type="button">Lấy mã OTP</button>
          </div>
        </div>

        <div class="field">
          <label for="forgotOtp">Mã OTP xác nhận *</label>
          <input id="forgotOtp" class="otp-input" type="text" maxlength="6" required placeholder="••••••">
        </div>

        <div class="field">
          <label for="forgotNewPassword">Mật khẩu mới (tối thiểu 8 ký tự) *</label>
          <input id="forgotNewPassword" type="password" minlength="8" required placeholder="••••••••">
        </div>

        <button class="button full-btn" style="margin-top: 20px;" type="submit">Đặt lại mật khẩu</button>
        <div id="forgotAlert" class="message" role="status"></div>
      </form>

      <p class="register-link"><a href="login.html">← Quay lại đăng nhập</a></p>
    </section>
  </main>

  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/dark-mode.js"></script>
  <script src="../backend/public/js/account/login.js"></script>
</body>
</html>
