<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeCheck VN - Chi tiết cảnh báo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #26384d;
        }

        header {
            background: #102b50;
            color: white;
            padding: 18px 7%;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .logo span {
            color: #69b5ff;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .back-btn {
            background: #e5edf6;
            color: #102b50;
            border: none;
            border-radius: 7px;
            padding: 11px 16px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .detail-card {
            background: white;
            border: 1px solid #e0e7ef;
            border-radius: 13px;
            padding: 25px;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            border-bottom: 1px solid #edf1f5;
            padding-bottom: 20px;
        }

        .detail-header h1 {
            color: #102b50;
            font-size: 25px;
            margin-bottom: 12px;
        }

        .detail-meta {
            color: #718096;
            font-size: 14px;
            line-height: 1.8;
        }

        .status {
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .status-red {
            background: #ffe8ea;
            color: #c62832;
        }

        .status-yellow {
            background: #fff3d4;
            color: #946500;
        }

        .status-gray {
            background: #edf0f4;
            color: #596574;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1.3fr .7fr;
            gap: 20px;
            margin-top: 22px;
        }

        .section {
            border: 1px solid #e1e8f0;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 17px;
        }

        .section h2 {
            color: #102b50;
            font-size: 17px;
            margin-bottom: 13px;
        }

        .section p {
            color: #586b80;
            font-size: 14px;
            line-height: 1.8;
        }

        .report-info p {
            margin-bottom: 7px;
        }

        .evidence {
            background: #f4f7fa;
            border: 1px dashed #bdcbd9;
            border-radius: 8px;
            padding: 15px;
            color: #596b7f;
            font-size: 14px;
            line-height: 1.7;
        }

        .vote-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .vote-buttons button {
            border: none;
            border-radius: 7px;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .vote-yes {
            background: #e6f5eb;
            color: #187342;
        }

        .vote-no {
            background: #fff0e9;
            color: #a34d1c;
        }

        .vote-buttons button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .vote-result {
            font-size: 13px;
            color: #718096;
            margin-top: 13px;
            line-height: 1.7;
        }

        .comment {
            border-bottom: 1px solid #edf1f5;
            padding: 12px 0;
        }

        .comment:last-child {
            border-bottom: none;
        }

        .comment strong {
            color: #34465d;
            font-size: 13px;
        }

        .comment p {
            margin-top: 6px;
        }

        textarea {
            width: 100%;
            min-height: 85px;
            resize: vertical;
            border: 1px solid #d5deea;
            border-radius: 7px;
            padding: 11px;
            font-family: Arial, sans-serif;
            margin-top: 12px;
        }

        .send-btn {
            background: #1d5fa7;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 11px 17px;
            cursor: pointer;
            margin-top: 10px;
        }

        .notice {
            background: #eef5fc;
            color: #45617e;
            padding: 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.7;
        }

        .not-found {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            color: #718096;
        }

        footer {
            text-align: center;
            color: #8795a6;
            padding: 25px;
            font-size: 13px;
        }

        @media(max-width: 750px) {
            .detail-grid {
                grid-template-columns: 1fr;
            }

            .detail-header {
                flex-direction: column;
            }
        }

        @media(max-width: 500px) {
            .container {
                padding: 0 12px;
                margin-top: 22px;
            }

            .detail-card {
                padding: 15px;
            }

            .detail-header h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">SafeCheck <span>VN</span></div>
</header>

<div class="container">

    <button class="back-btn" onclick="goBack()">
        ← Quay lại kho cảnh báo
    </button>

    <div id="detailContent"></div>

</div>

<footer>
    SafeCheck VN - Chi tiết cảnh báo cộng đồng
</footer>

<script>
    const warnings = [
        {
            id: 1,
            title: "Tài khoản nhận tiền có dấu hiệu lừa đảo",
            target: "0123 456 789",
            type: "Giả mạo ngân hàng",
            bank: "Vietcombank",
            status: "red",
            reports: 18,
            date: "2026-11-14",
            method:
                "Đối tượng tự xưng là nhân viên ngân hàng, gọi điện yêu cầu xác minh tài khoản và cung cấp mã OTP. Sau đó hướng dẫn nạn nhân chuyển tiền đến một tài khoản khác.",
            evidence:
                "Ảnh chụp giao dịch đã che số tài khoản, tên người nhận và mã giao dịch. Nội dung tin nhắn đã được ẩn thông tin cá nhân.",
            comments: [
                "Tôi nhận được cuộc gọi với nội dung tương tự.",
                "Đã có người thân được cảnh báo về tài khoản này."
            ]
        },
        {
            id: 2,
            title: "Fanpage bán hàng yêu cầu chuyển khoản trước",
            target: "facebook.com/shop-gia-dung-abc",
            type: "Lừa đảo mua bán",
            bank: "MB Bank",
            status: "yellow",
            reports: 7,
            date: "2026-11-10",
            method:
                "Trang bán hàng đăng sản phẩm giá thấp bất thường và yêu cầu khách hàng chuyển khoản đặt cọc. Sau khi nhận tiền, trang ngừng phản hồi.",
            evidence:
                "Ảnh hội thoại đã che tên, ảnh đại diện và thông tin người gửi. Biên nhận chuyển khoản đã được ẩn số tài khoản.",
            comments: [
                "Nên kiểm tra kỹ thông tin người bán trước khi đặt cọc."
            ]
        },
        {
            id: 3,
            title: "Số điện thoại giả danh cơ quan chức năng",
            target: "09** *** 321",
            type: "Giả danh cơ quan",
            bank: "Không xác định",
            status: "red",
            reports: 24,
            date: "2026-11-08",
            method:
                "Người gọi thông báo người nghe có liên quan đến một vụ việc và yêu cầu giữ bí mật, kết nối cuộc gọi video hoặc chuyển tiền để xác minh.",
            evidence:
                "Nội dung cuộc gọi đã lược bỏ giọng nói và dữ liệu nhận dạng. Số điện thoại chỉ hiển thị một phần.",
            comments: [
                "Có cuộc gọi tương tự vào buổi chiều."
            ]
        },
        {
            id: 4,
            title: "Tài khoản tuyển cộng tác viên trực tuyến",
            target: "0987 *** 210",
            type: "Tuyển cộng tác viên",
            bank: "Techcombank",
            status: "yellow",
            reports: 5,
            date: "2026-10-29",
            method:
                "Đối tượng mời làm nhiệm vụ đặt đơn nhận hoa hồng. Ban đầu trả khoản tiền nhỏ, sau đó yêu cầu nạp số tiền lớn để mở khóa nhiệm vụ.",
            evidence:
                "Ảnh chụp nhóm trò chuyện đã che tên thành viên và thông tin cá nhân.",
            comments: [
                "Cẩn thận với những công việc yêu cầu nạp tiền trước."
            ]
        },
        {
            id: 5,
            title: "Tài khoản ngân hàng bị phản ánh nhiều lần",
            target: "****** 4568",
            type: "Giả mạo ngân hàng",
            bank: "Vietcombank",
            status: "gray",
            reports: 2,
            date: "2026-09-20",
            method:
                "Có phản ánh về giao dịch không rõ ràng. Hiện thông tin chưa đủ để xác định hành vi lừa đảo.",
            evidence:
                "Chứng từ đã che số tài khoản, tên chủ tài khoản và mã giao dịch.",
            comments: [
                "Cần thêm thông tin xác thực trước khi kết luận."
            ]
        },
        {
            id: 6,
            title: "Website giả mạo chương trình ưu đãi",
            target: "qua-tang-khach-hang.example",
            type: "Lừa đảo mua bán",
            bank: "Không xác định",
            status: "red",
            reports: 13,
            date: "2026-11-12",
            method:
                "Website quảng cáo nhận quà miễn phí, yêu cầu người dùng nhập thông tin đăng nhập và mã xác thực.",
            evidence:
                "Ảnh chụp giao diện đã làm mờ logo, email và dữ liệu cá nhân.",
            comments: [
                "Không nhập mật khẩu hoặc OTP từ đường dẫn lạ."
            ]
        }
    ];

    const statusText = {
        red: "Đã xác nhận",
        yellow: "Đang nghi ngờ",
        gray: "Chưa đủ căn cứ"
    };

    const params = new URLSearchParams(window.location.search);
    const id = Number(params.get("id"));

    const warning = warnings.find(item => item.id === id);

    const content = document.getElementById("detailContent");

    function escapeHTML(value) {
        return value.replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);
    }

    function getVotes() {
        return JSON.parse(
            localStorage.getItem("safecheckVotes") || "{}"
        );
    }

    function getComments() {
        return JSON.parse(
            localStorage.getItem("safecheckComments") || "{}"
        );
    }

    function renderDetail() {
        if (!warning) {
            content.innerHTML = `
                <div class="not-found">
                    Không tìm thấy thông tin cảnh báo.
                </div>
            `;
            return;
        }

        const votes = getVotes();
        const comments = getComments();

        const voteData = votes[id] || {
            yes: 0,
            no: 0
        };

        const commentList = [
            ...warning.comments,
            ...(comments[id] || [])
        ];

        content.innerHTML = `
            <div class="detail-card">

                <div class="detail-header">

                    <div>
                        <h1>${warning.title}</h1>

                        <div class="detail-meta">
                            Đối tượng: ${warning.target}<br>
                            Ngân hàng: ${warning.bank}<br>
                            Ngày ghi nhận:
                            ${new Date(warning.date)
                                .toLocaleDateString("vi-VN")}
                        </div>
                    </div>

                    <span class="status status-${warning.status}">
                        ${statusText[warning.status]}
                    </span>

                </div>

                <div class="detail-grid">

                    <div>

                        <div class="section report-info">
                            <h2>Thông tin báo cáo</h2>

                            <p>
                                <b>Số báo cáo:</b>
                                ${warning.reports}
                            </p>

                            <p>
                                <b>Loại cảnh báo:</b>
                                ${warning.type}
                            </p>

                            <p>
                                <b>Trạng thái:</b>
                                ${statusText[warning.status]}
                            </p>
                        </div>

                        <div class="section">
                            <h2>Thủ đoạn được phản ánh</h2>
                            <p>${warning.method}</p>
                        </div>

                        <div class="section">
                            <h2>Bằng chứng đã che thông tin</h2>

                            <div class="evidence">
                                🔒 ${warning.evidence}
                            </div>
                        </div>

                        <div class="section">
                            <h2>Bình luận cộng đồng</h2>

                            <div id="commentList">
                                ${commentList.map(comment => `
                                    <div class="comment">
                                        <strong>Người dùng cộng đồng</strong>
                                        <p>${escapeHTML(comment)}</p>
                                    </div>
                                `).join("")}
                            </div>

                            <textarea
                                id="commentInput"
                                placeholder="Nhập bình luận của bạn..."
                            ></textarea>

                            <button class="send-btn" onclick="addComment()">
                                Gửi bình luận
                            </button>
                        </div>

                    </div>

                    <div>

                        <div class="section">
                            <h2>Đánh giá cảnh báo</h2>

                            <p>
                                Bạn có xác nhận thông tin cảnh báo này
                                là đúng không?
                            </p>

                            <div class="vote-buttons">

                                <button
                                    class="vote-yes"
                                    id="yesBtn"
                                    onclick="vote('yes')">
                                    ✓ Xác nhận đúng
                                </button>

                                <button
                                    class="vote-no"
                                    id="noBtn"
                                    onclick="vote('no')">
                                    ! Nghi ngờ sai
                                </button>

                            </div>

                            <div class="vote-result" id="voteResult">
                                Xác nhận đúng: ${voteData.yes}<br>
                                Nghi ngờ sai: ${voteData.no}
                            </div>
                        </div>

                        <div class="section">
                            <h2>Lưu ý</h2>

                            <div class="notice">
                                Thông tin do cộng đồng gửi và cần được
                                kiểm chứng. Không chia sẻ dữ liệu cá nhân
                                hoặc tự kết luận khi chưa có đủ căn cứ.
                            </div>
                        </div>

                    </div>

                </div>

            </div>
        `;
    }

    function vote(type) {
        const allVotes = getVotes();

        const votedItems = JSON.parse(
            localStorage.getItem("safecheckVoted") || "{}"
        );

        if (votedItems[id]) {
            alert("Bạn đã bỏ phiếu cho cảnh báo này rồi.");
            return;
        }

        if (!allVotes[id]) {
            allVotes[id] = {
                yes: 0,
                no: 0
            };
        }

        allVotes[id][type]++;

        votedItems[id] = type;

        localStorage.setItem(
            "safecheckVotes",
            JSON.stringify(allVotes)
        );

        localStorage.setItem(
            "safecheckVoted",
            JSON.stringify(votedItems)
        );

        renderDetail();

        alert("Đã ghi nhận đánh giá của bạn.");
    }

    function addComment() {
        const input = document.getElementById("commentInput");
        const value = input.value.trim();

        if (!value) {
            alert("Vui lòng nhập nội dung bình luận.");
            return;
        }

        const allComments = getComments();

        if (!allComments[id]) {
            allComments[id] = [];
        }

        allComments[id].push(value);

        localStorage.setItem(
            "safecheckComments",
            JSON.stringify(allComments)
        );

        renderDetail();
    }

    function goBack() {
        window.location.href = "warning-list.html";
    }

    renderDetail();
</script>

</body>
</html>
