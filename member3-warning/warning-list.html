<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeCheck VN - Kho cảnh báo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #24364b;
        }

        header {
            background: #102b50;
            color: white;
            padding: 18px 7%;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .logo span {
            color: #69b5ff;
        }

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            color: #102b50;
            margin-bottom: 10px;
        }

        .page-title p {
            color: #718096;
            line-height: 1.5;
        }

        .filter-box {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid #e0e7ef;
        }

        .filter-item label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .filter-item select,
        .filter-item input {
            width: 100%;
            padding: 11px;
            border: 1px solid #d5deea;
            border-radius: 7px;
            outline: none;
        }

        .filter-item select:focus,
        .filter-item input:focus {
            border-color: #2876c7;
        }

        .reset-btn {
            background: #e9f1fa;
            color: #102b50;
            border: none;
            border-radius: 7px;
            padding: 11px;
            cursor: pointer;
            font-weight: bold;
            align-self: end;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 17px;
        }

        .section-heading h2 {
            color: #102b50;
            font-size: 21px;
        }

        #resultCount {
            color: #718096;
            font-size: 14px;
        }

        .warning-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .warning-card {
            background: white;
            border: 1px solid #e1e8f0;
            border-radius: 12px;
            padding: 19px;
            display: flex;
            flex-direction: column;
            min-height: 240px;
            transition: .2s;
        }

        .warning-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(16, 43, 80, .08);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-red {
            color: #c62832;
            background: #ffe8ea;
        }

        .status-yellow {
            color: #946500;
            background: #fff3d4;
        }

        .status-gray {
            color: #596574;
            background: #edf0f4;
        }

        .category {
            background: #edf3fa;
            color: #42617f;
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 11px;
        }

        .warning-card h3 {
            color: #102b50;
            font-size: 17px;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .warning-info {
            color: #718096;
            font-size: 13px;
            line-height: 1.9;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #edf1f5;
            padding-top: 14px;
            margin-top: auto;
        }

        .report-count {
            color: #718096;
            font-size: 13px;
        }

        .detail-btn {
            background: #102b50;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 9px 13px;
            cursor: pointer;
        }

        .detail-btn:hover {
            background: #1d5fa7;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 30px 0;
        }

        .pagination button {
            min-width: 38px;
            padding: 10px;
            background: white;
            border: 1px solid #dce5ef;
            border-radius: 7px;
            color: #102b50;
            cursor: pointer;
        }

        .pagination button.active {
            background: #102b50;
            color: white;
        }

        .empty {
            grid-column: 1 / -1;
            background: white;
            padding: 35px;
            text-align: center;
            color: #718096;
            border-radius: 10px;
        }

        footer {
            text-align: center;
            color: #8795a6;
            padding: 25px;
            font-size: 13px;
        }

        @media(max-width: 900px) {
            .warning-list {
                grid-template-columns: repeat(2, 1fr);
            }

            .filter-box {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 600px) {
            .warning-list,
            .filter-box {
                grid-template-columns: 1fr;
            }

            .container {
                margin-top: 25px;
                padding: 0 14px;
            }

            .page-title h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">SafeCheck <span>VN</span></div>
</header>

<div class="container">

    <div class="page-title">
        <h1>Kho cảnh báo lừa đảo</h1>
        <p>
            Tra cứu thông tin cảnh báo được cộng đồng gửi báo cáo.
            Kiểm tra thông tin trước khi thực hiện giao dịch.
        </p>
    </div>

    <div class="filter-box">

        <div class="filter-item">
            <label for="typeFilter">Loại lừa đảo</label>
            <select id="typeFilter">
                <option value="">Tất cả loại</option>
                <option>Giả mạo ngân hàng</option>
                <option>Lừa đảo mua bán</option>
                <option>Giả danh cơ quan</option>
                <option>Tuyển cộng tác viên</option>
            </select>
        </div>

        <div class="filter-item">
            <label for="bankFilter">Ngân hàng</label>
            <select id="bankFilter">
                <option value="">Tất cả ngân hàng</option>
                <option>Vietcombank</option>
                <option>MB Bank</option>
                <option>Techcombank</option>
                <option>Không xác định</option>
            </select>
        </div>

        <div class="filter-item">
            <label for="timeFilter">Thời gian</label>
            <select id="timeFilter">
                <option value="">Tất cả thời gian</option>
                <option value="7">7 ngày gần đây</option>
                <option value="30">30 ngày gần đây</option>
                <option value="90">90 ngày gần đây</option>
            </select>
        </div>

        <div class="filter-item">
            <label for="searchInput">Tìm kiếm</label>
            <input
                type="text"
                id="searchInput"
                placeholder="Nhập thông tin cần tìm..."
            >
        </div>

        <button class="reset-btn" id="resetBtn">
            Xóa bộ lọc
        </button>

    </div>

    <div class="section-heading">
        <h2>Danh sách cảnh báo</h2>
        <span id="resultCount"></span>
    </div>

    <div class="warning-list" id="warningList"></div>

    <div class="pagination" id="pagination"></div>

</div>

<footer>
    SafeCheck VN - Kho cảnh báo cộng đồng
</footer>

<script>
    const warnings = [
        {
            id: 1,
            title: "Tài khoản nhận tiền có dấu hiệu lừa đảo",
            target: "0123 456 789",
            type: "Giả mạo ngân hàng",
            bank: "Vietcombank",
            status: "red",
            reports: 18,
            date: "2026-11-14"
        },
        {
            id: 2,
            title: "Fanpage bán hàng yêu cầu chuyển khoản trước",
            target: "facebook.com/shop-gia-dung-abc",
            type: "Lừa đảo mua bán",
            bank: "MB Bank",
            status: "yellow",
            reports: 7,
            date: "2026-11-10"
        },
        {
            id: 3,
            title: "Số điện thoại giả danh cơ quan chức năng",
            target: "09** *** 321",
            type: "Giả danh cơ quan",
            bank: "Không xác định",
            status: "red",
            reports: 24,
            date: "2026-11-08"
        },
        {
            id: 4,
            title: "Tài khoản tuyển cộng tác viên trực tuyến",
            target: "0987 *** 210",
            type: "Tuyển cộng tác viên",
            bank: "Techcombank",
            status: "yellow",
            reports: 5,
            date: "2026-10-29"
        },
        {
            id: 5,
            title: "Tài khoản ngân hàng bị phản ánh nhiều lần",
            target: "****** 4568",
            type: "Giả mạo ngân hàng",
            bank: "Vietcombank",
            status: "gray",
            reports: 2,
            date: "2026-09-20"
        },
        {
            id: 6,
            title: "Website giả mạo chương trình ưu đãi",
            target: "qua-tang-khach-hang.example",
            type: "Lừa đảo mua bán",
            bank: "Không xác định",
            status: "red",
            reports: 13,
            date: "2026-11-12"
        }
    ];

    const statusText = {
        red: "Đã xác nhận",
        yellow: "Đang nghi ngờ",
        gray: "Chưa đủ căn cứ"
    };

    let currentPage = 1;
    const itemsPerPage = 3;

    function getFilteredWarnings() {
        const type = document.getElementById("typeFilter").value;
        const bank = document.getElementById("bankFilter").value;
        const days = Number(document.getElementById("timeFilter").value);
        const search = document.getElementById("searchInput")
            .value.trim().toLowerCase();

        const today = new Date("2026-11-17T12:00:00");

        return warnings.filter(item => {
            const dateDiff =
                (today - new Date(item.date + "T12:00:00")) /
                (1000 * 60 * 60 * 24);

            return (!type || item.type === type) &&
                (!bank || item.bank === bank) &&
                (!days || dateDiff <= days) &&
                (!search ||
                    (item.title + " " + item.target)
                    .toLowerCase().includes(search));
        });
    }

    function renderWarnings() {
        const data = getFilteredWarnings();

        const totalPages = Math.max(
            1,
            Math.ceil(data.length / itemsPerPage)
        );

        currentPage = Math.min(currentPage, totalPages);

        const start = (currentPage - 1) * itemsPerPage;
        const pageData = data.slice(start, start + itemsPerPage);

        document.getElementById("resultCount").textContent =
            data.length + " cảnh báo";

        const list = document.getElementById("warningList");

        if (pageData.length === 0) {
            list.innerHTML =
                '<div class="empty">Không tìm thấy cảnh báo phù hợp.</div>';
        } else {
            list.innerHTML = pageData.map(item => `
                <div class="warning-card">

                    <div class="card-top">
                        <span class="status status-${item.status}">
                            ${statusText[item.status]}
                        </span>

                        <span class="category">
                            ${item.type}
                        </span>
                    </div>

                    <h3>${item.title}</h3>

                    <div class="warning-info">
                        Đối tượng: ${item.target}<br>
                        Ngân hàng: ${item.bank}<br>
                        Ngày cập nhật:
                        ${new Date(item.date).toLocaleDateString("vi-VN")}
                    </div>

                    <div class="card-bottom">
                        <span class="report-count">
                            ${item.reports} báo cáo
                        </span>

                        <button class="detail-btn"
                            onclick="viewDetail(${item.id})">
                            Xem chi tiết
                        </button>
                    </div>

                </div>
            `).join("");
        }

        renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
        const pagination = document.getElementById("pagination");

        pagination.innerHTML = "";

        for (let i = 1; i <= totalPages; i++) {
            const button = document.createElement("button");

            button.textContent = i;

            if (i === currentPage) {
                button.classList.add("active");
            }

            button.onclick = function () {
                currentPage = i;
                renderWarnings();
                window.scrollTo({ top: 0, behavior: "smooth" });
            };

            pagination.appendChild(button);
        }
    }

    function viewDetail(id) {
        window.location.href = "warning-detail.html?id=" + id;
    }

    ["typeFilter", "bankFilter", "timeFilter"].forEach(id => {
        document.getElementById(id).addEventListener("change", () => {
            currentPage = 1;
            renderWarnings();
        });
    });

    document.getElementById("searchInput")
        .addEventListener("input", () => {
            currentPage = 1;
            renderWarnings();
        });

    document.getElementById("resetBtn").onclick = function () {
        document.getElementById("typeFilter").value = "";
        document.getElementById("bankFilter").value = "";
        document.getElementById("timeFilter").value = "";
        document.getElementById("searchInput").value = "";

        currentPage = 1;
        renderWarnings();
    };

    renderWarnings();
</script>

</body>
</html>
