<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - SafeCheckVN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/account.css" rel="stylesheet">
</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card auth-card p-4 shadow-sm">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-2" style="width: 56px; height: 56px;">
        <i class="bi bi-shield-lock-fill fs-2"></i>
      </div>
      <h4 class="fw-bold mb-1">Đăng nhập tài khoản</h4>
      <p class="text-muted small">Chào mừng bạn quay trở lại với SafeCheckVN</p>
    </div>

    <div id="loginAlert" class="alert d-none py-2 small" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email hoặc Số điện thoại</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="loginIdentifier" placeholder="nguyenvana@gmail.com" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Mật khẩu</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-key"></i></span>
          <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
          <button class="btn btn-outline-secondary toggle-pwd" type="button" data-target="#loginPassword">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe" checked>
          <label class="form-check-label small" for="rememberMe">Ghi nhớ đăng nhập</label>
        </div>
        <a href="forgot-password.html" class="small text-decoration-none fw-semibold">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3">
        <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
      </button>
    </form>

    <div class="text-center my-2 position-relative">
      <hr class="text-muted">
      <span class="bg-white px-2 text-muted small position-absolute top-50 start-50 translate-middle">Hoặc tiếp tục với</span>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-6">
        <button type="button" class="btn btn-outline-danger w-100 social-btn btn-social" data-provider="Google">
          <i class="bi bi-google me-1"></i> Google
        </button>
      </div>
      <div class="col-6">
        <button type="button" class="btn btn-outline-primary w-100 social-btn btn-social" data-provider="Facebook">
          <i class="bi bi-facebook me-1"></i> Facebook
        </button>
      </div>
    </div>

    <div class="text-center small text-muted">
      Chưa có tài khoản? <a href="register.html" class="fw-semibold text-decoration-none">Đăng ký ngay</a>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/login.js"></script>
</body>
</html>
