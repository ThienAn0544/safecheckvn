<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Đăng nhập - SafeCheck</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="css/account.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav container">
      <a class="brand" href="../index.html"><span class="brand-mark">✓</span>SafeCheck</a>
      <div class="nav-links">
        <a href="../index.html">Trang chủ</a>
        <a href="../member3-warning/warning-list.html">Cảnh báo</a>
        <a href="../member5-news/news.html">Tin tức</a>
        <a href="../member2-report/report.html">Gửi báo cáo</a>
        <a class="active" href="login.html">Đăng nhập</a>
        <button class="button outline" type="button" data-dark-toggle>◐</button>
      </div>
    </nav>
  </header>

  <main class="auth-wrap">
    <section class="card auth-card">
      <div class="auth-icon">🔐</div>
      <div class="eyebrow">Tài khoản SafeCheck</div>
      <h1>Đăng nhập</h1>
      <p class="muted">Đăng nhập để theo dõi tiến độ duyệt báo cáo và quản lý danh sách cảnh báo.</p>

      <form id="loginForm">
        <div class="field">
          <label for="loginIdentifier">Email hoặc Số điện thoại</label>
          <input id="loginIdentifier" type="text" autocomplete="username" required placeholder="nguyenvana@gmail.com">
        </div>

        <div class="field">
          <label for="loginPassword">Mật khẩu</label>
          <div class="input-action-row">
            <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Nhập mật khẩu">
            <button id="togglePassword" class="button outline" type="button">Hiện</button>
          </div>
        </div>

        <div class="login-options">
          <label class="remember"><input id="rememberMe" type="checkbox" checked> Ghi nhớ đăng nhập</label>
          <a href="forgot-password.html">Quên mật khẩu?</a>
        </div>

        <button class="button full-btn" type="submit">Đăng nhập</button>
        <div id="loginAlert" class="message" role="status"></div>
      </form>

      <div class="divider-line">Hoặc tiếp tục với</div>
      <div class="social-grid">
        <button type="button" class="social-btn" data-social="Google">🌐 Google</button>
        <button type="button" class="social-btn" data-social="Facebook">📘 Facebook</button>
      </div>

      <p class="register-link">Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
    </section>
  </main>

  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/dark-mode.js"></script>
  <script src="../backend/public/js/member4/login.js"></script>
</body>
</html>
