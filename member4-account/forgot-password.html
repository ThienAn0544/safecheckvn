<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khôi phục mật khẩu - SafeCheckVN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/account.css" rel="stylesheet">
</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card auth-card p-4 shadow-sm">
    <div class="text-center mb-3">
      <div class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-10 text-warning rounded-circle mb-2" style="width: 56px; height: 56px;">
        <i class="bi bi-shield-exclamation fs-2"></i>
      </div>
      <h4 class="fw-bold mb-1">Khôi phục mật khẩu</h4>
      <p class="text-muted small">Nhập thông tin tài khoản để nhận mã OTP đặt lại mật khẩu</p>
    </div>

    <div id="forgotAlert" class="alert d-none py-2 small" role="alert"></div>

    <form id="forgotForm">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email hoặc Số điện thoại đăng ký</label>
        <div class="input-group">
          <input type="text" class="form-control" id="forgotIdentifier" placeholder="nguyenvana@gmail.com" required>
          <button class="btn btn-outline-primary" type="button" id="btnSendForgotOtp">Lấy mã</button>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Mã OTP khôi phục</label>
        <input type="text" class="form-control text-center fw-bold letter-spacing-2" id="forgotOtp" maxlength="6" placeholder="• • • • • •" required>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Mật khẩu mới</label>
        <input type="password" class="form-control" id="forgotNewPassword" placeholder="Tối thiểu 6 ký tự" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3">Đặt lại mật khẩu</button>
    </form>

    <div class="text-center small">
      <a href="login.html" class="text-decoration-none fw-semibold"><i class="bi bi-arrow-left me-1"></i>Quay lại đăng nhập</a>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  $(document).ready(function() {
    let generatedOtp = null;
    const USERS_KEY = 'scam_alert_users';

    $('#btnSendForgotOtp').on('click', function() {
      const identifier = $('#forgotIdentifier').val().trim();
      if(!identifier) {
        $('#forgotAlert').removeClass('d-none alert-success alert-info').addClass('alert-danger').text('Vui lòng nhập Email hoặc Số điện thoại.');
        return;
      }
      const users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
      const user = users.find(u => u.email === identifier || u.phone === identifier);
      if(!user) {
        $('#forgotAlert').removeClass('d-none alert-success alert-info').addClass('alert-danger').text('Không tìm thấy tài khoản tương ứng trong hệ thống.');
        return;
      }
      generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
      $('#forgotOtp').val(generatedOtp);
      $('#forgotAlert').removeClass('d-none alert-danger').addClass('alert-info').html(`Mã OTP giả lập của bạn là: <strong>${generatedOtp}</strong>`);
    });

    $('#forgotForm').on('submit', function(e) {
      e.preventDefault();
      const identifier = $('#forgotIdentifier').val().trim();
      const otp = $('#forgotOtp').val().trim();
      const newPwd = $('#forgotNewPassword').val();

      if(!generatedOtp || otp !== generatedOtp) {
        $('#forgotAlert').removeClass('d-none alert-success alert-info').addClass('alert-danger').text('Mã OTP không chính xác hoặc chưa được cấp.');
        return;
      }
      if(newPwd.length < 6) {
        $('#forgotAlert').removeClass('d-none alert-success alert-info').addClass('alert-danger').text('Mật khẩu mới phải từ 6 ký tự trở lên.');
        return;
      }

      let users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
      let idx = users.findIndex(u => u.email === identifier || u.phone === identifier);
      if(idx !== -1) {
        users[idx].password = newPwd;
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
        $('#forgotAlert').removeClass('d-none alert-danger alert-info').addClass('alert-success').text('Đặt lại mật khẩu thành công! Đang chuyển hướng về trang đăng nhập...');
        setTimeout(() => window.location.href = 'login.html', 1500);
      }
    });
  });
</script>
</body>
</html>
