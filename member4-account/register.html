<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký - SafeCheckVN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/account.css" rel="stylesheet">
</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
  <div class="card auth-card p-4 shadow-sm">
    <div class="text-center mb-3">
      <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle mb-2" style="width: 56px; height: 56px;">
        <i class="bi bi-person-plus-fill fs-2"></i>
      </div>
      <h4 class="fw-bold mb-1">Tạo tài khoản mới</h4>
      <p class="text-muted small">Tham gia mạng lưới bảo vệ cộng đồng trực tuyến</p>
    </div>

    <div id="registerAlert" class="alert d-none py-2 small" role="alert"></div>

    <form id="registerForm" novalidate>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Họ và tên hiển thị</label>
        <input type="text" class="form-control" id="regFullName" placeholder="Nguyễn Văn A" required>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Email hoặc Số điện thoại</label>
        <div class="input-group">
          <input type="text" class="form-control" id="regIdentifier" placeholder="Email hoặc SĐT (VD: 0901234567)" required>
          <button class="btn btn-outline-primary fw-semibold" type="button" id="btnSendOtp">Gửi OTP</button>
        </div>
        <div class="form-text small" id="otpHint">Nhấn "Gửi OTP" để nhận mã xác thực 6 số giả lập.</div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Mã xác thực OTP</label>
        <input type="text" class="form-control text-center fw-bold letter-spacing-2" id="regOtp" maxlength="6" placeholder="• • • • • •" required>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Mật khẩu</label>
        <div class="input-group">
          <input type="password" class="form-control" id="regPassword" placeholder="Tối thiểu 6 ký tự" required>
          <button class="btn btn-outline-secondary toggle-pwd" type="button" data-target="#regPassword">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Xác nhận mật khẩu</label>
        <input type="password" class="form-control" id="regConfirmPassword" placeholder="Nhập lại mật khẩu" required>
      </div>

      <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-3 mb-3">
        <i class="bi bi-check-circle me-1"></i> Hoàn tất đăng ký
      </button>
    </form>

    <div class="text-center small text-muted">
      Đã có tài khoản? <a href="login.html" class="fw-semibold text-decoration-none">Đăng nhập ngay</a>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/register.js"></script>
</body>
</html>
