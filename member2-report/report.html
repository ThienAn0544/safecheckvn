<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gửi báo cáo - SafeCheck</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/responsive.css"></head><body><header class="site-header"><nav class="nav container"><a class="brand" href="../index.html"><span class="brand-mark">✓</span>SafeCheck</a><div class="nav-links"><a href="../index.html">Trang chủ</a><a href="../member3-warning/warning-list.html">Cảnh báo</a><a class="active" href="report.html">Gửi báo cáo</a><a class="button outline" href="../member4-account/login.html">Đăng nhập</a></div></nav></header><main><section class="page-head"><div class="container"><div class="eyebrow">Đóng góp cho cộng đồng</div><h1>Gửi báo cáo lừa đảo</h1><p class="muted">Thông tin sẽ được kiểm duyệt trước khi công bố.</p></div></section><form id="report-form" class="card form-card"><div class="form-grid"><div class="field"><label for="reporterName">Họ tên</label><input id="reporterName" name="reporterName" placeholder="Có thể để trống"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="email@example.com"></div><div class="field"><label for="scamType">Loại lừa đảo *</label><select id="scamType" name="scamType" required><option value="">Chọn loại</option><option>Giả mạo ngân hàng</option><option>Đầu tư tài chính</option><option>Mua bán trực tuyến</option><option>Việc làm</option><option>Khác</option></select></div><div class="field"><label for="suspectValue">Thông tin đối tượng *</label><input id="suspectValue" name="suspectValue" required placeholder="SĐT, tài khoản, website..."></div><div class="field full"><label for="description">Mô tả sự việc *</label><textarea id="description" name="description" minlength="20" required placeholder="Mô tả diễn biến, thời gian và dấu hiệu đáng ngờ..."></textarea></div><div class="field full"><button class
